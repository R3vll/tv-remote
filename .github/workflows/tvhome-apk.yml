# Builds TV Home (app/tvhome) as an APK and attaches it to a GitHub release, for trying a change on a TV.
# Started by hand only (never on push). The APK is signed with a key made on the runner (app/tvhome/build.sh does that when
# signing.jks is missing), so it cannot update a TV Home installed from another build: uninstall that one first.
name: tvhome-apk
on:
  workflow_dispatch:
    inputs:
      tag: { description: "release tag to create or update with tv-home.apk", required: true, default: "tvhome-test" }
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: build
        run: bash app/tvhome/build.sh
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/tvhome/build/tv-home.apk tv-home.apk
          if gh release view "${{ inputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ inputs.tag }}" tv-home.apk --clobber
          else
            gh release create "${{ inputs.tag }}" tv-home.apk --prerelease --target "${{ github.sha }}" --title "TV Home test build ${{ inputs.tag }}" --notes "TV Home built from ${{ github.sha }} (test build, signed with a throwaway key)."
          fi
